[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "randomly"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
check = "python check.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/randomly.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/randomly.yml"

[dependencies]
python = "3.13.*"
anndata = "*"
h5py = "*"
numpy = "*"
pandas = "*"
scipy = "*"
# imported at load time by the vendored randomly/ (plotting helpers we never call)
matplotlib-base = "*"
seaborn = "*"
scikit-learn = "*"
