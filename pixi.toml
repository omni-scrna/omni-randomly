[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "randomly"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
check = "python check.py"
agreement = "python tests/agreement.py"   # add NORMALIZED.h5 for the real-data check
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/randomly.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/randomly.yml"

[dependencies]
python = "3.13.*"
anndata = "*"
h5py = "*"
numpy = "*"
pandas = "*"
scipy = "*"
# imported at load time by the vendored randomly/ (plotting helpers we never call)
matplotlib-base = "*"
scikit-learn = "*"

# GPU eigh for RmFast(backend="cupy"); linux-64 only
[feature.gpu]
platforms = ["linux-64"]
# deprecated table, but pixi 0.71 only takes { platform, cuda } on the workspace
# platforms, which would put the CUDA requirement on the CPU env too
system-requirements = { cuda = "12" }

[feature.gpu.dependencies]
cupy = ">=14,<15"
cuda-version = "12.*"

[feature.gpu.tasks]
export-env-gpu = "pixi workspace export conda-environment -e gpu --name randomly-gpu envs/randomly-gpu.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/randomly-gpu.yml"

# env for quick dev tasks - avoid the regular deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
gpu = { features = ["gpu"] }
dev = { features = ["dev"], no-default-feature = true }
